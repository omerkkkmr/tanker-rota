<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sipariş Girişi — Tanker Rota</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{--ink:#1b1917;--ink2:#2a2621;--bg:#f4f1ea;--card:#ffffff;--line:#e5ddc9;--muted:#8b8377;--muted2:#6d655a;
  --hi:#d9a441;--hi-bg:#e6b558;--hi-border:#a4700f;--diesel:#1f7a44;--alert:#c8402c;--htext:#f3efe7;
  --blue:#1f6fd0;--green:#2f8f4f;--xfer:#8b3fb5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{transition:border-color .15s ease,background-color .15s ease,color .15s ease}
html,body{height:100%}
body{font-family:'Manrope',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
input,button,select,textarea{font-family:inherit;font-size:16px}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono'}

header{position:sticky;top:0;z-index:10;background:var(--ink);color:#f2f0ec;
  padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
header span{font-family:'IBM Plex Mono';font-size:11px;color:#b7ada0}

.wrap{max-width:560px;margin:0 auto;padding:0 0 60px}

/* form bloğu: görev formundaki başlık bloğu gibi beyaz + 2px koyu ayraç */
.card{background:#fff;border-bottom:2px solid var(--ink);padding:14px 16px 16px}
label{display:block;font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:12px 11px;
  font-family:'IBM Plex Mono';font-size:15px;border-radius:4px}
input:focus,select:focus{outline:2px solid var(--hi);outline-offset:-1px;border-color:var(--hi)}
select{cursor:pointer}
.primary{width:100%;margin-top:16px;padding:14px;background:var(--green);border:0;color:#fff;border-radius:4px;font-weight:700;font-size:14px}
.primary:active{filter:brightness(.9)}
.primary:disabled{background:#e5ddc9;color:#a89f8f;cursor:wait}
.msg{font-family:'IBM Plex Mono';font-size:11px;min-height:16px;margin-top:10px;text-align:center}
.msg.ok{color:var(--diesel)}
.msg.err{color:var(--alert)}

/* bölüm şeridi: görev formundaki sekme şeridi gibi */
.sectitle{background:var(--ink2);color:#c9c0b0;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.sectitle b{font-family:'IBM Plex Mono';color:#fff;font-weight:600}

/* sipariş satırı = görev formu adımı */
.ocard{background:#fff;border-bottom:1px solid var(--line);padding:13px 16px;display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start}
.sh-n{width:36px;height:36px;border-radius:50%;background:var(--muted);color:#fff;display:flex;align-items:center;justify-content:center;
  font-family:'IBM Plex Mono';font-size:15px;font-weight:600}
.st-wait .sh-n{background:#8b8377}
.st-plan .sh-n{background:var(--blue)}
.st-done .sh-n{background:var(--green)}
.st-onay .sh-n{background:var(--xfer)}
.sh-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh-t b{font-size:16px;font-weight:600;line-height:1.25}
.sh-time{font-family:'IBM Plex Mono';font-size:15px;font-weight:600;white-space:nowrap}
.sh-info{font-family:'IBM Plex Mono';font-size:12px;color:#4a4741;margin-top:5px;line-height:1.6}
.sh-vol{display:inline-block;background:var(--ink);color:#fff;padding:2px 8px;border-radius:4px;font-family:'Manrope';font-weight:700;font-size:13px;margin-right:4px}
.st-done .sh-vol{background:var(--green)}
.st-onay .sh-vol{background:var(--xfer)}
.obadge{font-family:'IBM Plex Mono';font-size:9px;padding:3px 8px;border-radius:999px;letter-spacing:.06em;white-space:nowrap;border:1px solid;vertical-align:middle}
.b-wait{color:var(--muted2);border-color:var(--line);background:#efe9dc}
.b-plan{color:#1f6fd0;border-color:#cfe0f5;background:#eaf2fc}
.b-done{color:var(--diesel);border-color:#c9e8d2;background:#e8f6ec}
.b-onay{color:#7a3fa8;border-color:#d9bdec;background:#f3e9fa}
.sh-note{background:#fff8e1;border-left:3px solid #b06a00;padding:8px 11px;margin-top:8px;font-size:12px;line-height:1.5}
.ophotos{display:flex;gap:6px;margin-top:8px}
.ophotos img{width:52px;height:52px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.sh-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.sh-btn{display:inline-flex;align-items:center;gap:6px;color:#fff;border:0;padding:9px 14px;border-radius:4px;font-weight:600;font-size:12px;background:var(--blue)}
.sh-btn.line{background:#fff;color:var(--ink);border:1px solid #cfc6b2}
.sh-btn.red{background:#fff;color:var(--alert);border:1px solid #e3b9b1}
.sh-btn:active{filter:brightness(.9)}
.empty{padding:24px 16px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono';font-size:12px;background:#fff;border-bottom:1px solid var(--line)}

.mappick{background:#fff;border:1px solid #cfc6b2;color:var(--muted2);padding:10px 12px;border-radius:4px;font-family:'IBM Plex Mono';font-size:11px;width:100%;margin-top:8px;text-align:left;
  display:flex;align-items:center;gap:8px}
.mappick.have{border-color:var(--green);color:var(--diesel)}
#pickMap{display:none;height:240px;border-radius:4px;margin-top:8px;border:1px solid var(--line)}
#pickMap.on{display:block}
.pickhint{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);text-align:center;margin-top:6px;display:none}
.pickhint.on{display:block}

/* modal: koyu başlık şeritli */
.dlg{position:fixed;inset:0;background:rgba(27,25,23,.6);z-index:3000;display:none;align-items:flex-end;justify-content:center}
.dlg.on{display:flex}
.dlgbox{background:#fff;border-radius:0;padding:0 0 22px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto}
.dlgbox>*{margin-left:18px;margin-right:18px}
.dlgbox>h3{margin:0;padding:14px 18px;background:var(--ink);color:#f2f0ec;font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.dlgbox>.csub{margin:0 0 6px;padding:8px 18px;background:var(--ink2);color:#a39a8c;font-family:'IBM Plex Mono';font-size:11px}
.dlgbox>input,.dlgbox>select{width:calc(100% - 36px)}
.dlgbox>#eDateBox input{width:100%}
.dlgbtns{display:flex;gap:8px;margin-top:18px}
.dlgbtns button{flex:1;padding:14px;border-radius:4px;font-weight:700;font-size:14px;border:1px solid #cfc6b2;background:#fff;color:var(--muted2)}
.dlgbtns .save{background:var(--green);border-color:var(--green);color:#fff}

/* tarih alanı: iOS Safari bunu farklı yükseklikte/ortalı çizer — diğer alanlarla hizala */
input,select{min-height:48px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left;line-height:normal}
input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0;min-height:1.2em}
</style>
</head>
<body>

<header>
  <h1>Sipariş Girişi</h1>
  <span id="topDate"></span>
</header>

<div class="wrap">
  <div class="card">
    <label>Müşteri</label>
    <select id="osel" onchange="toggleNewCust()"></select>
    <input id="ncname" placeholder="Yeni müşteri adı" style="display:none;margin-top:8px">
    <button type="button" class="mappick" id="gpsBtn" style="display:none" onclick="useMyLocation()">🎯 Şu anki konumumu kullan</button>
    <button type="button" class="mappick" id="mapPickBtn" style="display:none" onclick="toggleMapPicker()">📍 Haritadan Konum Seç (opsiyonel)</button>
    <div id="pickMap"></div>
    <div class="pickhint" id="pickHint">Haritada müşterinin konumuna dokun</div>
    <label>Teslim günü (gelecek tarih = ajanda)</label>
    <input id="odate" type="date">
    <label>Miktar (L)</label>
    <input id="oqty" type="number" placeholder="Miktar (L)" value="5000">
    <label>Not (opsiyonel)</label>
    <input id="onote" placeholder="—">
    <button class="primary" id="addBtn" onclick="addOrder()">+ Talep Ekle</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="sectitle">Açık Siparişler <b id="openCount">0</b></div>
  <div id="ordlist"></div>

  <div class="sectitle" style="margin-top:18px">Son Teslim Edilenler <b id="doneCount">0</b></div>
  <div id="donelist"></div>
</div>

<div class="dlg" id="edlg">
  <div class="dlgbox">
    <h3>Siparişi düzenle</h3>
    <div class="csub" id="eSub"></div>
    <label>Müşteri</label>
    <select id="eCust"></select>
    <div id="eDateBox"><label>Teslim günü</label><input id="eDate" type="date"></div>
    <label>Miktar (L)</label>
    <input id="eQty" type="number" inputmode="numeric">
    <label>Not</label>
    <input id="eNote" placeholder="—">
    <div class="msg err" id="eMsg"></div>
    <div class="dlgbtns">
      <button onclick="closeEdit()">Vazgeç</button>
      <button class="save" id="eSave" onclick="saveEdit()">Kaydet</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://vtrtshvfwjjazpvcmfcq.supabase.co';
const SB_KEY='sb_publishable_IIiVphchfanRWnzi9jehCQ_qt6w8i8o';
const sb=window.supabase.createClient(SB_URL,SB_KEY);

const L2=n=>Math.round(n).toLocaleString('tr');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDT=s=>s?new Date(s).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const ST={wait:{lab:'BEKLİYOR',cls:'wait'},plan:{lab:'PLANLANDI',cls:'plan'},done:{lab:'TESLİM',cls:'done'},onay:{lab:'ONAY BEKLİYOR',cls:'onay'}};
const isoDay=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');};
const todayStr=()=>isoDay(new Date());
const addDays1=()=>{const d=new Date();d.setDate(d.getDate()+1);return isoDay(d);};   // yeni siparişte varsayılan teslim günü: yarın
const planDay=o=>o.plan_date||isoDay(o.created_at||new Date());
const fmtDay=iso=>new Date(iso+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'short'});

let customers=[], orderList=[], doneList=[];

async function load(){
  const[cs,od,dn]=await Promise.all([
    sb.from('customers').select('id,name').order('name'),
    sb.from('orders').select('*').in('status',['wait','plan','road']).order('created_at',{ascending:false}),
    sb.from('orders').select('*').in('status',['done','onay']).order('delivered_at',{ascending:false}).limit(15),
  ]);
  if(cs.data)customers=cs.data;
  if(od.data)orderList=od.data;
  if(dn.data)doneList=dn.data;
  renderCustSelect();
  renderOrders();
  renderDone();
  subscribeRealtime();
}
function renderCustSelect(){
  const sel=document.getElementById('osel');
  const cur=sel.value;
  sel.innerHTML=customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')
    +'<option value="__new__">+ Yeni müşteri ekle</option>';
  if(cur&&(cur==='__new__'||customers.some(c=>c.id===cur)))sel.value=cur;
  toggleNewCust();
}
function toggleNewCust(){
  const isNew=document.getElementById('osel').value==='__new__';
  document.getElementById('ncname').style.display=isNew?'block':'none';
  document.getElementById('mapPickBtn').style.display=isNew?'flex':'none';
  document.getElementById('gpsBtn').style.display=isNew?'flex':'none';
  if(!isNew){
    pickedLoc=null;
    document.getElementById('pickMap').classList.remove('on');
    document.getElementById('pickHint').classList.remove('on');
    resetPickBtn();
  }else{
    document.getElementById('ncname').focus();
  }
}

/* ---------- harita ile konum seçme (opsiyonel, yeni müşteri için) ---------- */
let pickMap=null, pickMarker=null, pickedLoc=null;
const DEPOT_LAT=40.7480, DEPOT_LNG=30.3900;
function resetPickBtn(){
  const b=document.getElementById('mapPickBtn');
  b.className='mappick';
  b.textContent='📍 Haritadan Konum Seç (opsiyonel)';
}
function setPickedLoc(lat,lng){
  pickedLoc={lat,lng};
  if(pickMap){
    const ll=[lat,lng];
    if(pickMarker)pickMarker.setLatLng(ll);else pickMarker=L.marker(ll).addTo(pickMap);
    pickMap.setView(ll,16);
  }
  const btn=document.getElementById('mapPickBtn');
  btn.className='mappick have';
  btn.textContent=`✓ Konum seçildi (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
}
function useMyLocation(){
  const b=document.getElementById('gpsBtn');
  if(!navigator.geolocation)return alert('Bu cihaz konum almayı desteklemiyor.');
  const old=b.textContent;
  b.disabled=true;b.textContent='Konum alınıyor…';
  navigator.geolocation.getCurrentPosition(
    pos=>{b.disabled=false;b.textContent=old;setPickedLoc(pos.coords.latitude,pos.coords.longitude);},
    err=>{b.disabled=false;b.textContent=old;alert(err.code===1?'Konum izni verilmedi — tarayıcı/telefon ayarlarından bu site için konuma izin ver.':'Konum alınamadı, tekrar dene.');},
    {enableHighAccuracy:true,timeout:10000}
  );
}
function toggleMapPicker(){
  const box=document.getElementById('pickMap'), hint=document.getElementById('pickHint');
  const show=!box.classList.contains('on');
  box.classList.toggle('on',show);
  hint.classList.toggle('on',show);
  if(show&&!pickMap){
    pickMap=L.map('pickMap').setView([DEPOT_LAT,DEPOT_LNG],11);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      {attribution:'Tiles &copy; Esri',maxZoom:19}).addTo(pickMap);
    pickMap.on('click',e=>{
      pickedLoc={lat:e.latlng.lat,lng:e.latlng.lng};
      if(pickMarker)pickMarker.setLatLng(e.latlng);else pickMarker=L.marker(e.latlng).addTo(pickMap);
      const btn=document.getElementById('mapPickBtn');
      btn.className='mappick have';
      btn.textContent=`✓ Konum seçildi (${pickedLoc.lat.toFixed(4)}, ${pickedLoc.lng.toFixed(4)})`;
    });
  }
  if(show&&pickMap)setTimeout(()=>pickMap.invalidateSize(),150);
}
const hm=x=>x?new Date(x).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):'';
const GL={wait:'…',plan:'▸',done:'✓',onay:'⏳'};
function renderOrders(){
  document.getElementById('openCount').textContent=orderList.length;
  const el=document.getElementById('ordlist');
  if(!orderList.length){el.innerHTML='<div class="empty">Açık sipariş yok</div>';return;}
  el.innerHTML=orderList.slice().sort((a,b)=>planDay(a).localeCompare(planDay(b))||String(a.created_at).localeCompare(String(b.created_at))).map(o=>{
    const c=customers.find(c=>c.id===o.customer_id);
    const s=ST[o.status==='road'?'plan':o.status]||ST.wait;
    return `<div class="ocard st-${s.cls}">
      <div class="sh-n">${GL[o.status]||'…'}</div>
      <div>
        <div class="sh-t"><b>${c?esc(c.name):'<i>silinmiş müşteri</i>'}</b><span class="sh-time">${hm(o.created_at)}</span></div>
        <div class="sh-info"><span class="sh-vol">${L2(o.qty)} L</span><span class="obadge b-${s.cls}">${s.lab}</span>
          <br>${fmtDT(o.created_at)} girildi</div>
        ${planDay(o)>todayStr()?`<div class="sh-note"><b>📅 Ajanda:</b> ${fmtDay(planDay(o))} — o gün rotaya girer.</div>`:planDay(o)<todayStr()?`<div class="sh-note" style="background:#fbeae7;border-left-color:#c8402c"><b>Gecikmiş:</b> ${fmtDay(planDay(o))} için girilmişti.</div>`:''}
        ${o.note?`<div class="sh-info">Not: ${esc(o.note)}</div>`:''}
        ${o.status==='plan'?'<div class="sh-note">Planlandı — miktarı değiştirirsen rota planlayıcıda yeniden hesaplanınca güncellenir.</div>':''}
        <div class="sh-acts">
          ${(o.status==='wait'||o.status==='plan')?`<button class="sh-btn line" onclick="openEdit('${o.id}')">✎ Düzenle</button>`:''}
          ${o.status==='wait'?`<button class="sh-btn red" onclick="cancelOrder('${o.id}')">İptal et</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}
function renderDone(){
  document.getElementById('doneCount').textContent=doneList.length;
  const el=document.getElementById('donelist');
  if(!doneList.length){el.innerHTML='<div class="empty">Henüz teslim yok</div>';return;}
  el.innerHTML=doneList.map(o=>{
    const c=customers.find(c=>c.id===o.customer_id);
    const pend=o.status==='onay';
    const k=pend?'onay':'done';
    return `<div class="ocard st-${k}">
      <div class="sh-n">${GL[k]}</div>
      <div>
        <div class="sh-t"><b>${c?esc(c.name):'<i>silinmiş müşteri</i>'}</b><span class="sh-time">${hm(o.delivered_at)}</span></div>
        <div class="sh-info"><span class="sh-vol">${L2(o.delivered_qty??o.qty)} L</span><span class="obadge b-${k}">${pend?'ONAY BEKLİYOR':'TESLİM'}</span>
          <br>${fmtDT(o.delivered_at)} ${pend?'teslim girildi':'teslim edildi'} · sipariş ${L2(o.qty)} L${o.vehicle?` · ${esc(o.vehicle)}`:''}</div>
        ${o.photos&&o.photos.length?`<div class="ophotos">${o.photos.map(p=>
          `<a href="${p.url}" target="_blank"><img src="${p.thumb||p.url}" loading="lazy" title="${p.type==='tank'?'Dolum tankı':p.type==='irsaliye'?'İrsaliye':p.type}"></a>`).join('')}</div>`:''}
      </div>
    </div>`;
  }).join('');
}

async function addOrder(){
  let cid=document.getElementById('osel').value;
  const qty=parseInt(document.getElementById('oqty').value);
  const note=document.getElementById('onote').value.trim();
  const msg=document.getElementById('msg');
  msg.className='msg';msg.textContent='';
  const isNew=cid==='__new__';
  const newName=document.getElementById('ncname').value.trim();
  if(!cid){msg.className='msg err';msg.textContent='Önce müşteri seç.';return;}
  if(isNew&&!newName){msg.className='msg err';msg.textContent='Yeni müşterinin adını gir.';return;}
  if(!qty||qty<=0){msg.className='msg err';msg.textContent='Geçerli miktar gir.';return;}
  const btn=document.getElementById('addBtn');
  btn.disabled=true;
  try{
    if(isNew){
      // konum haritadan seçildiyse onu kullan, seçilmediyse garaj konumuyla
      // (geçici) kaydedilir — planlamacı ekranındaki "Haritadan seç" ile
      // sonradan düzeltilebilir.
      const loc=pickedLoc||{lat:DEPOT_LAT,lng:DEPOT_LNG};
      const{data,error}=await sb.from('customers').insert({name:newName,lat:loc.lat,lng:loc.lng}).select().single();
      if(error)throw error;
      cid=data.id;
    }
    const pd=(document.getElementById('odate').value||todayStr())<todayStr()?todayStr():(document.getElementById('odate').value||todayStr());
    let{error}=await sb.from('orders').insert({customer_id:cid,qty,status:'wait',note:note||'',plan_date:pd});
    if(error&&/plan_date/.test(error.message||''))({error}=await sb.from('orders').insert({customer_id:cid,qty,status:'wait',note:note||''}));
    if(error)throw error;
    document.getElementById('onote').value='';
    document.getElementById('odate').value=addDays1();
    if(isNew){
      document.getElementById('ncname').value='';
      document.getElementById('pickMap').classList.remove('on');
      document.getElementById('pickHint').classList.remove('on');
      resetPickBtn();
    }
    const hadLoc=isNew&&pickedLoc;
    pickedLoc=null;
    if(pickMarker&&pickMap){pickMap.removeLayer(pickMarker);pickMarker=null;}
    msg.className='msg ok';
    msg.textContent=pd>todayStr()?`✓ Ajandaya eklendi: ${fmtDay(pd)}`:isNew?(hadLoc?'✓ Yeni müşteri + talep eklendi':'✓ Yeni müşteri + talep eklendi (konum planlayıcıdan düzeltilmeli)'):'✓ Talep eklendi';
    setTimeout(()=>{msg.textContent='';},3500);
    load();
  }catch(e){
    console.warn(e);
    msg.className='msg err';msg.textContent='Kaydedilemedi — internet/sinyal kontrol edin.';
  }finally{
    btn.disabled=false;
  }
}
let edId=null;
function openEdit(id){
  const o=orderList.find(x=>x.id===id);if(!o)return;
  edId=id;
  document.getElementById('eSub').textContent=ST[o.status]?.lab||'';
  document.getElementById('eCust').innerHTML=customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');
  document.getElementById('eCust').value=o.customer_id;
  document.getElementById('eQty').value=o.qty;
  document.getElementById('eDate').value=planDay(o);
  document.getElementById('eNote').value=o.note||'';
  document.getElementById('eMsg').textContent='';
  document.getElementById('edlg').classList.add('on');
}
function closeEdit(){document.getElementById('edlg').classList.remove('on');edId=null;}
async function saveEdit(){
  const msg=document.getElementById('eMsg');
  const qty=parseInt(document.getElementById('eQty').value);
  const cid=document.getElementById('eCust').value;
  if(!cid){msg.textContent='Müşteri seç.';return;}
  if(!qty||qty<=0){msg.textContent='Geçerli miktar gir.';return;}
  const btn=document.getElementById('eSave');btn.disabled=true;
  try{
    // yalnızca hâlâ açık (bekliyor/planlandı) siparişler değiştirilebilir — arada yola çıkmış/teslim edilmişse reddedilir
    const upd={customer_id:cid,qty,note:document.getElementById('eNote').value.trim(),plan_date:document.getElementById('eDate').value||todayStr()};
    const cur=orderList.find(x=>x.id===edId);
    // gelecek güne alınan planlı sipariş atamasını kaybeder (o gün gelince yeniden atanır)
    if(cur&&cur.status==='plan'&&upd.plan_date>todayStr()){upd.status='wait';upd.vehicle=null;upd.comp=null;upd.planned_at=null;}
    let{data,error}=await sb.from('orders').update(upd).eq('id',edId).in('status',['wait','plan']).select('id');
    if(error&&/plan_date/.test(error.message||'')){delete upd.plan_date;({data,error}=await sb.from('orders').update(upd).eq('id',edId).in('status',['wait','plan']).select('id'));}
    if(error)throw error;
    if(!data||!data.length){msg.textContent='Bu sipariş artık düzenlenemez (yola çıkmış ya da teslim edilmiş).';load();return;}
    closeEdit();load();
  }catch(e){
    console.warn(e);msg.textContent='Kaydedilemedi — internet/sinyal kontrol edin.';
  }finally{btn.disabled=false;}
}
async function cancelOrder(id){
  if(!confirm('Bu talebi iptal etmek istediğine emin misin?'))return;
  try{
    const{error}=await sb.from('orders').update({status:'canc'}).eq('id',id);
    if(error)throw error;
    load();
  }catch(e){
    console.warn(e);
    alert('İptal edilemedi — internet/sinyal kontrol edin.');
  }
}

let rtActive=false;
function subscribeRealtime(){
  if(rtActive)return;
  rtActive=true;
  sb.channel('siparis-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'orders'},()=>load())
    .on('postgres_changes',{event:'*',schema:'public',table:'customers'},()=>load())
    .subscribe();
}

document.getElementById('odate').value=addDays1();
document.getElementById('topDate').textContent=new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
load();
// yedek yenileme: realtime bağlantısı sessizce koparsa kendini onarır
setInterval(load,20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
</script>
