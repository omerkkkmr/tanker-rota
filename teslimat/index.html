<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Teslimat — Tanker Rota</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1917;--bg:#f4f1ea;--card:#ffffff;--line:#e5ddc9;--muted:#8b8377;--muted2:#6d655a;
  --hi:#d9a441;--hi-bg:#e6b558;--hi-border:#a4700f;--diesel:#1f7a44;--alert:#c8402c;--xfer:#8b3fb5;--htext:#f3efe7}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Instrument Sans',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
input,button,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono';}

/* ---- giriş ekranı ---- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
#login h1{font-size:20px;font-weight:700;letter-spacing:.02em}
#login .sub{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);text-align:center;line-height:1.6}
.plateList{width:280px;max-width:85vw;display:flex;flex-direction:column;gap:10px}
.plateBtn{width:100%;padding:16px;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:6px;
  font-family:'IBM Plex Mono';font-size:18px;font-weight:600;letter-spacing:.04em;text-align:center}
.plateBtn:active{border-color:var(--hi-border);color:var(--hi-border)}
#loginErr{color:#b3392a;font-family:'IBM Plex Mono';font-size:11px;min-height:14px;text-align:center}

/* ---- ana ekran ---- */
#app{display:none;min-height:100vh;flex-direction:column}
#app.on{display:flex}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:var(--htext);
  padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header .plate{font-family:'IBM Plex Mono';font-size:19px;font-weight:600;letter-spacing:.03em}
header .sub{font-family:'IBM Plex Mono';font-size:9px;color:#b7ada0;margin-top:2px}
header button{background:transparent;border:1px solid #4a4032;color:#cdc5b8;padding:8px 12px;border-radius:3px;
  font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.05em}
header button:active{border-color:var(--hi);color:var(--hi)}

#summary{display:flex;gap:1px;background:var(--line)}
#summary .cell{flex:1;background:var(--card);padding:12px 8px;text-align:center}
#summary .cell b{display:block;font-family:'IBM Plex Mono';font-size:18px;font-weight:600;color:var(--ink)}
#summary .cell span{font-family:'IBM Plex Mono';font-size:9px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}

#refreshRow{padding:8px 16px;display:flex;justify-content:space-between;align-items:center}
#refreshRow button{background:transparent;border:1px solid var(--line);color:var(--muted2);padding:6px 10px;
  border-radius:3px;font-family:'IBM Plex Mono';font-size:10px}
#lastSync{font-family:'IBM Plex Mono';font-size:9px;color:var(--muted)}

#timeline{flex:1;padding:0 12px 40px;overflow-y:auto}
.leg{margin:10px 0}
.leg-info{background:var(--card);border-left:3px solid var(--line);border-radius:2px;padding:10px 12px;
  font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);line-height:1.6}
.leg-info b{color:var(--ink)}
.stop{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;
  align-items:center;gap:12px}
.stop.done{opacity:.75;border-color:var(--diesel)}
.stop-n{width:30px;height:30px;border-radius:50%;background:var(--ink);border:2px solid var(--hi);color:var(--hi);
  display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-weight:600;font-size:12px;flex-shrink:0}
.stop.done .stop-n{border-color:var(--diesel);color:var(--diesel)}
.stop-body{flex:1;min-width:0}
.stop-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop-meta{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);margin-top:3px}
.stop-badge{font-family:'IBM Plex Mono';font-size:9px;padding:3px 7px;border-radius:2px;letter-spacing:.05em;
  text-transform:uppercase;flex-shrink:0}
.stop-badge.wait{background:#fbf1d9;color:var(--hi-border)}
.stop-badge.done{background:#e8f6ec;color:var(--diesel)}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-family:'IBM Plex Mono';font-size:12px;line-height:1.8}

/* ---- teslim modalı ---- */
.dlg{position:fixed;inset:0;background:rgba(27,25,23,.6);z-index:3000;display:none;align-items:flex-end;justify-content:center}
.dlg.on{display:flex}
.dlgbox{background:var(--card);border-radius:12px 12px 0 0;padding:18px 18px 26px;width:100%;max-width:480px;
  max-height:92vh;overflow-y:auto;box-shadow:0 -8px 30px rgba(27,25,23,.25)}
.dlgbox h3{font-size:16px;font-weight:700;margin-bottom:2px}
.dlgbox .csub{font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);margin-bottom:16px}
.dlgbox label{display:block;font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;margin:14px 0 6px}
.dlgbox input[type=number],.dlgbox input[type=text]{width:100%;padding:12px;background:var(--bg);
  border:1px solid var(--line);color:var(--ink);border-radius:4px;font-family:'IBM Plex Mono';font-size:16px}
.photobtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px;background:var(--bg);
  border:1px dashed var(--line);color:var(--muted2);border-radius:4px;font-family:'IBM Plex Mono';font-size:11px;text-align:left}
.photobtn.have{border-style:solid;border-color:var(--diesel);color:var(--diesel)}
.photobtn img{width:36px;height:36px;object-fit:cover;border-radius:3px;flex-shrink:0}
.photobtn .icon{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:#efe9dc;border-radius:3px;font-size:16px}
.dlgbtns{display:flex;gap:8px;margin-top:20px}
.dlgbtns button{flex:1;padding:14px;border-radius:4px;font-weight:700;letter-spacing:0;text-transform:none;
  font-size:13px;border:0}
.btn-cancel{background:transparent!important;border:1px solid var(--line)!important;color:var(--muted2)}
.btn-save{background:var(--hi-bg);color:var(--ink);border:1px solid var(--hi-border)}
.btn-save:disabled{background:#e5ddc9;color:#a89f8f;border-color:#e5ddc9}
.savingNote{font-family:'IBM Plex Mono';font-size:10px;color:var(--muted);margin-top:10px;text-align:center;min-height:14px}
.readonly-block{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;margin-top:6px;font-family:'IBM Plex Mono';font-size:11px;line-height:1.8}
.readonly-photos{display:flex;gap:8px;margin-top:8px}
.readonly-photos a img{width:70px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
</style>
</head>
<body>

<div id="login">
  <h1>Tankerini Seç</h1>
  <div class="sub">Bugün kullandığın tankeri listeden seç.</div>
  <div id="plateList" class="plateList"></div>
  <div id="loginErr"></div>
</div>

<div id="app">
  <header>
    <div>
      <div class="plate mono" id="hdrPlate">—</div>
      <div class="sub" id="hdrDate">—</div>
    </div>
    <button onclick="doLogout()">Çıkış</button>
  </header>

  <div id="summary">
    <div class="cell"><b id="sTot">0</b><span>Durak</span></div>
    <div class="cell"><b id="sDone">0</b><span>Tamam</span></div>
    <div class="cell"><b id="sVol">0</b><span>Teslim L</span></div>
  </div>

  <div id="refreshRow">
    <span id="lastSync" class="mono"></span>
    <button onclick="loadRoute(true)">↻ Yenile</button>
  </div>

  <div id="timeline"></div>
</div>

<div class="dlg" id="dlg">
  <div class="dlgbox" id="dlgBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ---------- Supabase (aynı proje, planlayıcıyla ortak) ---------- */
const SB_URL='https://vtrtshvfwjjazpvcmfcq.supabase.co';
const SB_KEY='sb_publishable_IIiVphchfanRWnzi9jehCQ_qt6w8i8o';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const SESSION_KEY='soforOturumV1';

const G=0,P=1;   // garaj / tesis düğüm indeksleri (rota yayınında kullanılmıyor ama netlik için)
const L2=n=>Math.round(n).toLocaleString('tr');
const hhmm=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,mi=m%60;return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navUrl=(lat,lng)=>`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;

let session=null;        // {id,plate}
let myVehicle=null;      // routes.data.vehicles[] içindeki kendi kaydı
let orderStatus={};      // oid -> orders satırı (status/delivered_qty/photos/...)
let rtChannel=null;

/* ---------- giriş / çıkış ---------- */
function loadSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;}}
function saveSession(s){try{localStorage.setItem(SESSION_KEY,JSON.stringify(s));}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);}catch(e){}}

async function loadPlateList(){
  const err=document.getElementById('loginErr');
  const box=document.getElementById('plateList');
  err.textContent='';box.innerHTML='<div class="sub">Yükleniyor…</div>';
  try{
    const{data,error}=await sb.from('tankers').select('id,plate').order('sort');
    if(error)throw error;
    if(!data||!data.length){box.innerHTML='';err.textContent='Kayıtlı tanker bulunamadı.';return;}
    box.innerHTML=data.map(t=>`<button class="plateBtn" onclick='selectPlate(${JSON.stringify(t.id)},${JSON.stringify(t.plate)})'>${esc(t.plate)}</button>`).join('');
  }catch(e){
    console.warn(e);
    box.innerHTML='';
    err.textContent='Bağlantı hatası — internet/sinyal kontrol edin.';
  }
}
function selectPlate(id,plate){
  session={id,plate};
  saveSession(session);
  enterApp();
}
function doLogout(){
  if(rtChannel){sb.removeChannel(rtChannel);rtChannel=null;}
  clearSession();session=null;myVehicle=null;orderStatus={};
  document.getElementById('app').classList.remove('on');
  document.getElementById('login').style.display='flex';
  loadPlateList();
}
function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  document.getElementById('hdrPlate').textContent=session.plate;
  document.getElementById('hdrDate').textContent=new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
  loadRoute(true);
  subscribeRealtime();
}

/* ---------- rota yükleme ---------- */
async function loadRoute(manual){
  const tl=document.getElementById('timeline');
  if(manual)tl.innerHTML='<div class="empty">Yükleniyor…</div>';
  try{
    const{data,error}=await sb.from('routes').select('data').eq('id',1).single();
    if(error)throw error;
    const payload=data?.data;
    myVehicle=(payload?.vehicles||[]).find(v=>v.plate===session.plate)||null;
    if(myVehicle){
      const oids=myVehicle.legs.filter(l=>l.kind==='drop').map(l=>l.oid).filter(Boolean);
      if(oids.length){
        const{data:ords,error:oe}=await sb.from('orders').select('*').in('id',oids);
        if(oe)throw oe;
        orderStatus={};ords.forEach(o=>orderStatus[o.id]=o);
      }else orderStatus={};
    }
    document.getElementById('lastSync').textContent='son güncelleme: '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(e){
    console.warn(e);
    tl.innerHTML='<div class="empty">Rota yüklenemedi.<br>İnternet/sinyal kontrol edip "Yenile"ye basın.</div>';
  }
}
function subscribeRealtime(){
  if(rtChannel)return;
  rtChannel=sb.channel('sofor-routes')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'routes'},()=>loadRoute(false))
    .subscribe();
}

/* ---------- görünüm ---------- */
function render(){
  const tl=document.getElementById('timeline');
  if(!myVehicle){
    tl.innerHTML='<div class="empty">Bugün için sana atanmış bir rota yok.<br>Planlamacı rotayı yayınladığında burada görünecek.</div>';
    document.getElementById('sTot').textContent='0';
    document.getElementById('sDone').textContent='0';
    document.getElementById('sVol').textContent='0';
    return;
  }
  const drops=myVehicle.legs.filter(l=>l.kind==='drop');
  const doneCount=drops.filter(l=>orderStatus[l.oid]?.status==='done').length;
  const volDone=drops.reduce((s,l)=>{const o=orderStatus[l.oid];return s+(o?.status==='done'?(o.delivered_qty||0):0);},0);
  document.getElementById('sTot').textContent=drops.length;
  document.getElementById('sDone').textContent=doneCount;
  document.getElementById('sVol').textContent=L2(volDone);

  let n=0;
  tl.innerHTML=myVehicle.legs.map((l,i)=>{
    if(l.kind==='garage')return `<div class="leg"><div class="leg-info">🏁 <b>${esc(l.label)}</b> · ${hhmm(l.time)}</div></div>`;
    if(l.kind==='plant'){
      const done=fisUploaded[i];
      return `<div class="leg"><div class="leg-info">⛽ <b>Tesiste dolum</b> · ${hhmm(l.time)} · ${L2(l.vol)} L
        <div style="margin-top:8px">${done
          ?`<span style="color:var(--diesel)">✓ Fiş yüklendi</span>`
          :`<button class="photobtn" style="width:auto;display:inline-flex" onclick="openFis(${i},${l.vol})"><span class="icon">🧾</span><span>Fiş Yükle</span></button>`}</div>
        </div></div>`;
    }
    if(l.kind==='xfer')return `<div class="leg"><div class="leg-info">⇄ <b>Garajda aktarım</b> · ${hhmm(l.time)}<br>${(l.items||[]).map(t=>t.to===session.plate?`<b>${esc(t.from)}</b>'den ${L2(t.vol)} L alındı`:`<b>${esc(t.to)}</b>'e ${L2(t.vol)} L verildi`).join('<br>')}</div></div>`;
    if(l.kind==='feedout')return `<div class="leg"><div class="leg-info">📤 <b>Besleme (garajda aktarım)</b> · ${hhmm(l.time)} · ${L2(l.vol)} L dağıtıldı</div></div>`;
    if(l.kind!=='drop')return '';
    n++;
    const o=orderStatus[l.oid];
    const isDone=o?.status==='done';
    return `<div class="leg">
      <div class="stop${isDone?' done':''}" onclick="openStop('${l.oid}')">
        <div class="stop-n">${n}</div>
        <div class="stop-body">
          <div class="stop-name">${esc(l.name)}</div>
          <div class="stop-meta">planlanan ${L2(l.give)} L · ${hhmm(l.time)}${l.comp?' · göz '+l.comp:''}</div>
        </div>
        <div class="stop-badge ${isDone?'done':'wait'}">${isDone?'✓ Teslim':'Bekliyor'}</div>
      </div>
    </div>`;
  }).join('');
}

/* ---------- teslim modalı ---------- */
let curLeg=null;
let photoTank=null, photoIrs=null;
let fisUploaded={};   // plant leg index -> fiş foto url (bu oturum için)
let curFisIdx=null, curFisVol=null, photoFis=null;
function findLeg(oid){return myVehicle.legs.find(l=>l.kind==='drop'&&l.oid===oid);}

function openStop(oid){
  const l=findLeg(oid);if(!l)return;
  curLeg=l;photoTank=null;photoIrs=null;
  const o=orderStatus[oid];
  const box=document.getElementById('dlgBox');
  if(o&&o.status==='done'){
    const photos=o.photos||[];
    const tank=photos.find(p=>p.type==='tank'), irs=photos.find(p=>p.type==='irsaliye');
    box.innerHTML=`
      <h3>${esc(l.name)}</h3>
      <div class="csub">Teslim edildi · ${o.delivered_at?new Date(o.delivered_at).toLocaleString('tr-TR'):''}</div>
      <div class="readonly-block">
        Planlanan: <b>${L2(l.give)} L</b><br>
        Bırakılan: <b>${L2(o.delivered_qty||0)} L</b>
        ${o.deliver_note?`<br>Not: ${esc(o.deliver_note)}`:''}
      </div>
      <div class="readonly-photos">
        ${tank?`<a href="${tank.url}" target="_blank"><img src="${tank.url}"></a>`:''}
        ${irs?`<a href="${irs.url}" target="_blank"><img src="${irs.url}"></a>`:''}
      </div>
      <div class="dlgbtns">
        <button class="btn-cancel" onclick="closeDlg()">Kapat</button>
        <a href="${navUrl(l.lat,l.lng)}" target="_blank" style="flex:1"><button class="btn-save" style="width:100%">Yol Tarifi</button></a>
      </div>`;
  }else{
    box.innerHTML=`
      <h3>${esc(l.name)}</h3>
      <div class="csub">Planlanan miktar: ${L2(l.give)} L</div>

      <label>Boşaltılan Litre</label>
      <input type="number" id="fLitre" value="${l.give}" inputmode="numeric">

      <label>Dolum Tankı Fotoğrafı</label>
      <button class="photobtn" id="btnTank" onclick="document.getElementById('fileTank').click()">
        <span class="icon">📷</span><span>Fotoğraf çek</span>
      </button>
      <input type="file" id="fileTank" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this,'tank')">

      <label>İrsaliye Fotoğrafı</label>
      <button class="photobtn" id="btnIrs" onclick="document.getElementById('fileIrs').click()">
        <span class="icon">📄</span><span>Fotoğraf çek</span>
      </button>
      <input type="file" id="fileIrs" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this,'irsaliye')">

      <label>Not (opsiyonel)</label>
      <input type="text" id="fNote" placeholder="—">

      <div class="dlgbtns">
        <button class="btn-cancel" onclick="closeDlg()">Vazgeç</button>
        <button class="btn-save" id="btnSave" onclick="submitDelivery()" disabled>Teslimi Kaydet</button>
      </div>
      <div class="savingNote" id="saveNote"></div>
      <div class="dlgbtns" style="margin-top:8px">
        <a href="${navUrl(l.lat,l.lng)}" target="_blank" style="flex:1"><button class="btn-cancel" style="width:100%">🧭 Yol Tarifi</button></a>
      </div>`;
  }
  document.getElementById('dlg').classList.add('on');
}
function closeDlg(){document.getElementById('dlg').classList.remove('on');curLeg=null;photoTank=null;photoIrs=null;curFisIdx=null;photoFis=null;}

/* ---------- dolum fişi (tesiste alınan makbuz) ---------- */
function openFis(idx,vol){
  curFisIdx=idx;curFisVol=vol;photoFis=null;
  const box=document.getElementById('dlgBox');
  box.innerHTML=`
    <h3>Dolum Fişi</h3>
    <div class="csub">${session.plate} · ${L2(vol)} L dolum</div>
    <label>Fiş Fotoğrafı</label>
    <button class="photobtn" id="btnFis" onclick="document.getElementById('fileFis').click()">
      <span class="icon">🧾</span><span>Fotoğraf çek</span>
    </button>
    <input type="file" id="fileFis" accept="image/*" capture="environment" style="display:none" onchange="onFisPhoto(this)">
    <label>Not (opsiyonel)</label>
    <input type="text" id="fFisNote" placeholder="—">
    <div class="dlgbtns">
      <button class="btn-cancel" onclick="closeDlg()">Vazgeç</button>
      <button class="btn-save" id="btnFisSave" onclick="submitFis()" disabled>Fişi Kaydet</button>
    </div>
    <div class="savingNote" id="saveNote"></div>`;
  document.getElementById('dlg').classList.add('on');
}
function onFisPhoto(input){
  const f=input.files[0];if(!f)return;
  photoFis=f;
  const url=URL.createObjectURL(f);
  document.getElementById('btnFis').className='photobtn have';
  document.getElementById('btnFis').innerHTML=`<img src="${url}"><span>Fotoğraf alındı ✓ (değiştirmek için dokun)</span>`;
  document.getElementById('btnFisSave').disabled=false;
}
async function submitFis(){
  if(curFisIdx==null||!photoFis)return;
  const note=document.getElementById('fFisNote').value.trim();
  const btn=document.getElementById('btnFisSave');
  const noteEl=document.getElementById('saveNote');
  btn.disabled=true;
  try{
    noteEl.textContent='Fotoğraf yükleniyor…';
    const url=await uploadPhoto(photoFis,`plant-${curFisIdx}`,'fis');
    noteEl.textContent='Kaydediliyor…';
    const{error}=await sb.from('dolum_fisleri').insert({plate:session.plate,vol:curFisVol,photo_url:url,note:note||null});
    if(error)throw error;
    fisUploaded[curFisIdx]=url;
    closeDlg();
    render();
  }catch(e){
    console.warn(e);
    noteEl.textContent='Hata: kaydedilemedi. Sinyal kontrol edip tekrar deneyin.';
    btn.disabled=false;
  }
}

function onPhoto(input,type){
  const f=input.files[0];if(!f)return;
  const url=URL.createObjectURL(f);
  if(type==='tank'){
    photoTank=f;
    document.getElementById('btnTank').className='photobtn have';
    document.getElementById('btnTank').innerHTML=`<img src="${url}"><span>Fotoğraf alındı ✓ (değiştirmek için dokun)</span>`;
  }else{
    photoIrs=f;
    document.getElementById('btnIrs').className='photobtn have';
    document.getElementById('btnIrs').innerHTML=`<img src="${url}"><span>Fotoğraf alındı ✓ (değiştirmek için dokun)</span>`;
  }
  checkReady();
}
function checkReady(){
  const litre=parseFloat(document.getElementById('fLitre')?.value);
  const ok=litre>0&&photoTank&&photoIrs;
  const btn=document.getElementById('btnSave');
  if(btn)btn.disabled=!ok;
}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='fLitre')checkReady();});

function getGps(){
  return new Promise(resolve=>{
    if(!navigator.geolocation)return resolve(null);
    const timer=setTimeout(()=>resolve(null),4000);
    navigator.geolocation.getCurrentPosition(
      pos=>{clearTimeout(timer);resolve({lat:pos.coords.latitude,lng:pos.coords.longitude});},
      ()=>{clearTimeout(timer);resolve(null);},
      {enableHighAccuracy:true,timeout:3800}
    );
  });
}
function extOf(file){
  if(file.type==='image/png')return 'png';
  if(file.type==='image/webp')return 'webp';
  return 'jpg';
}
async function uploadPhoto(file,oid,tag){
  const path=`teslimat/${session.plate.replace(/\s+/g,'')}/${oid}-${Date.now()}-${tag}.${extOf(file)}`;
  const{error}=await sb.storage.from('belgeler').upload(path,file,{upsert:false,contentType:file.type||'image/jpeg'});
  if(error)throw error;
  const{data}=sb.storage.from('belgeler').getPublicUrl(path);
  return data.publicUrl;
}

async function submitDelivery(){
  if(!curLeg)return;
  const litre=parseFloat(document.getElementById('fLitre').value);
  const note=document.getElementById('fNote').value.trim();
  if(!(litre>0)||!photoTank||!photoIrs)return;
  const btn=document.getElementById('btnSave');
  const noteEl=document.getElementById('saveNote');
  btn.disabled=true;
  try{
    noteEl.textContent='Fotoğraflar yükleniyor…';
    const[tankUrl,irsUrl,gps]=await Promise.all([
      uploadPhoto(photoTank,curLeg.oid,'tank'),
      uploadPhoto(photoIrs,curLeg.oid,'irsaliye'),
      getGps()
    ]);
    noteEl.textContent='Kaydediliyor…';
    const{error}=await sb.from('orders').update({
      status:'done',
      delivered_qty:Math.round(litre),
      deliver_note:note||null,
      photos:[{type:'tank',url:tankUrl},{type:'irsaliye',url:irsUrl}],
      gps_lat:gps?gps.lat:null,
      gps_lng:gps?gps.lng:null,
      delivered_at:new Date().toISOString()
    }).eq('id',curLeg.oid);
    if(error)throw error;
    closeDlg();
    loadRoute(false);
  }catch(e){
    console.warn(e);
    noteEl.textContent='Hata: kaydedilemedi. Sinyal kontrol edip tekrar deneyin (girdikleriniz kaybolmadı).';
    btn.disabled=false;
  }
}

/* ---------- başlangıç ---------- */
(function init(){
  session=loadSession();
  if(session)enterApp();else loadPlateList();
})();
</script>
