<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Teslimat — Tanker Rota</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1917;--ink2:#2a2621;--bg:#f4f1ea;--card:#ffffff;--line:#e5ddc9;--muted:#8b8377;--muted2:#6d655a;
  --hi:#d9a441;--hi-bg:#e6b558;--hi-border:#a4700f;--diesel:#1f7a44;--alert:#c8402c;--xfer:#8b3fb5;--htext:#f3efe7;
  --blue:#1f6fd0;--green:#2f8f4f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{transition:border-color .15s ease,background-color .15s ease,color .15s ease}
html,body{height:100%}
body{font-family:'Manrope',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
input,button,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
.mono{font-family:'Manrope';}

/* ---- giriş ekranı ---- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
#login h1{font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
#login .sub{font-family:'Manrope';font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
.plateList{width:300px;max-width:88vw;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--card)}
.plateBtn{width:100%;padding:18px;background:var(--card);border:0;border-bottom:1px solid var(--line);color:var(--ink);border-radius:0;
  font-family:'Manrope';font-size:20px;font-weight:600;letter-spacing:.04em;text-align:center}
.plateBtn:last-child{border-bottom:0}
.plateBtn:active{background:var(--ink);color:#fff}
#loginErr{color:#b3392a;font-family:'Manrope';font-size:12px;min-height:14px;text-align:center}

/* ---- ana ekran: şoför görev formu düzeni ---- */
#app{display:none;min-height:100vh;flex-direction:column;max-width:560px;margin:0 auto;width:100%}
#app.on{display:flex}
header{position:sticky;top:0;z-index:10;background:var(--ink);color:#f2f0ec;
  padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header .plate{font-family:'Manrope';font-size:20px;font-weight:600;letter-spacing:.04em}
header .sub{font-family:'Manrope';font-size:11px;color:#b7ada0;margin-top:2px}
header button{background:transparent;border:1px solid #4a5665;color:#c3cad2;padding:7px 12px;border-radius:4px;
  font-size:12px;font-weight:600}
header button:active{border-color:var(--hi);color:var(--hi)}

.sh-head{background:#fff;border-bottom:2px solid var(--ink);padding:14px 16px 12px}
#summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
#summary .cell{background:#fff;padding:9px 4px;text-align:center}
#summary .cell b{display:block;font-family:'Manrope';font-size:16px;font-weight:600;color:var(--ink)}
#summary .cell span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#6e6a63}
.adhocRow{margin-top:12px}
.adhocBtn{width:100%;padding:12px;background:#fff;border:1.5px dashed var(--hi-border);color:var(--hi-border);
  border-radius:4px;font-weight:700;font-size:13px}
.adhocBtn:active{background:#fbf1d9}
#refreshRow{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
#refreshRow button{background:transparent;border:1px solid var(--line);color:var(--muted2);padding:5px 10px;
  border-radius:4px;font-family:'Manrope';font-size:11px}
#lastSync{font-family:'Manrope';font-size:11px;color:var(--muted)}

#timeline{flex:1;overflow-y:auto;padding-bottom:40px}
.sh-step{background:#fff;border-bottom:1px solid var(--line);padding:13px 16px;display:grid;
  grid-template-columns:36px 1fr;gap:12px;align-items:start}
.sh-n{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;
  align-items:center;justify-content:center;font-family:'Manrope';font-size:14px;font-weight:600}
.sh-n.sq{border-radius:4px;font-size:16px}
.sh-n.plant{background:var(--green)}
.sh-n.garage{background:var(--hi-bg);color:var(--ink)}
.sh-n.xfer{background:var(--xfer)}
.sh-n.ok{background:var(--green)}
.sh-n.pend{background:var(--xfer)}
.sh-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh-t b{font-size:16px;font-weight:600;line-height:1.25}
.sh-time{font-family:'IBM Plex Mono';font-size:15px;font-weight:600;white-space:nowrap}
.sh-info{font-family:'Manrope';font-size:12px;color:#4a4741;margin-top:5px;line-height:1.6}
.sh-vol{display:inline-block;background:var(--ink);color:#fff;padding:2px 8px;border-radius:4px;
  font-family:'Manrope';font-weight:700;font-size:13px;margin-right:4px}
.sh-vol.ok{background:var(--green)}
.sh-vol.pend{background:var(--xfer)}
.sh-note{background:#fff8e1;border-left:3px solid #b06a00;padding:8px 11px;margin-top:8px;font-size:12px;line-height:1.5}
.sh-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.sh-btn{display:inline-flex;align-items:center;gap:6px;color:#fff;border:0;text-decoration:none;padding:9px 14px;
  border-radius:4px;font-weight:600;font-size:12px;background:var(--blue)}
.sh-btn:active{filter:brightness(.9)}
.sh-btn.green{background:var(--green)}
.sh-btn.grey{background:#6e6a63}
.sh-btn.purple{background:var(--xfer)}
.sh-btn.line{background:#fff;color:var(--ink);border:1px solid #cfc6b2}
.secBand{background:var(--ink2);color:#c9c0b0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);font-family:'Manrope';font-size:12px;line-height:1.8;background:#fff}
.gpsInfo{font-family:'Manrope';font-size:12px;color:var(--muted);margin-top:8px}
.gpsInfo.ok{color:var(--diesel)}
.gpsInfo.err{color:var(--alert)}

/* ---- modal: koyu başlık şeritli ---- */
.dlg{position:fixed;inset:0;background:rgba(27,25,23,.6);z-index:3000;display:none;align-items:flex-end;justify-content:center}
.dlg.on{display:flex}
.dlgbox{background:#fff;border-radius:0;padding:0 0 22px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto}
.dlgbox>*{margin-left:18px;margin-right:18px}
.dlgbox>h3{margin:0;padding:14px 18px;background:var(--ink);color:#f2f0ec;font-size:14px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.dlgbox>.csub{margin:0 0 6px;padding:8px 18px;background:var(--ink2);color:#a39a8c;font-family:'Manrope';font-size:12px}
.dlgbox>input,.dlgbox>select,.dlgbox>.photobtn{width:calc(100% - 36px)}
.dlgbox label{display:block;font-family:'Manrope';font-size:11px;color:var(--muted);letter-spacing:.06em;
  text-transform:uppercase;margin-top:14px;margin-bottom:6px}
.dlgbox input[type=number],.dlgbox input[type=text],.dlgbox select{padding:12px;background:var(--bg);
  border:1px solid var(--line);color:var(--ink);border-radius:4px;font-family:'Manrope';font-size:16px}
.dlgbox input:focus,.dlgbox select:focus{outline:2px solid var(--hi);outline-offset:-1px;border-color:var(--hi)}
.photobtn{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);
  border:1px dashed #cfc6b2;color:var(--muted2);border-radius:4px;font-family:'Manrope';font-size:12px;text-align:left}
.photobtn.have{border-style:solid;border-color:var(--green);color:var(--diesel)}
.photobtn img{width:36px;height:36px;object-fit:cover;border-radius:4px;flex-shrink:0}
.photobtn .icon{width:36px;height:36px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  background:#efe9dc;border-radius:4px;font-size:16px}
.dlgbtns{display:flex;gap:8px;margin-top:20px}
.dlgbtns button{flex:1;padding:14px;border-radius:4px;font-weight:700;font-size:13px;border:0}
.btn-cancel{background:#fff!important;border:1px solid #cfc6b2!important;color:var(--muted2)}
.btn-save{background:var(--green);color:#fff}
.btn-save:disabled{background:#e5ddc9;color:#a89f8f}
.savingNote{font-family:'Manrope';font-size:11px;color:var(--muted);margin-top:10px;text-align:center;min-height:14px}
.readonly-block{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px;margin-top:6px;font-family:'Manrope';font-size:12px;line-height:1.8}
.readonly-photos{display:flex;gap:8px;margin-top:8px}
.readonly-photos a img{width:70px;height:70px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}

/* çift dokunmayla yakınlaşmayı kapat (kaydırma/harita hareketi etkilenmez) */
html,body,*{touch-action:manipulation}
</style>
</head>
<body>

<div id="login">
  <h1>Tankerini Seç</h1>
  <div class="sub">Bugün kullandığın tankeri listeden seç.</div>
  <div id="plateList" class="plateList"></div>
  <div id="loginErr"></div>
</div>

<div id="app">
  <header>
    <div>
      <div class="plate mono" id="hdrPlate">—</div>
      <div class="sub" id="hdrDate">—</div>
    </div>
    <button onclick="doLogout()">Çıkış</button>
  </header>

  <div class="sh-head">
    <div id="summary">
      <div class="cell"><b id="sTot">0</b><span>Durak</span></div>
      <div class="cell"><b id="sDone">0</b><span>Tamam</span></div>
      <div class="cell"><b id="sVol">0</b><span>Teslim L</span></div>
    </div>
    <div class="adhocRow"><button class="adhocBtn" onclick="openAdhoc()">➕ Plan dışı teslimat</button></div>
    <div id="refreshRow">
      <span id="lastSync" class="mono"></span>
      <button onclick="loadRoute(true)">↻ Yenile</button>
    </div>
  </div>

  <div id="timeline"></div>
</div>

<div class="dlg" id="dlg">
  <div class="dlgbox" id="dlgBox"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// iOS Safari: iki parmakla sıkıştırma yakınlaşmasını kapat (harita kendi dokunma yönetimini kullanır)
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault()));
/* ---------- Supabase (aynı proje, planlayıcıyla ortak) ---------- */
const SB_URL='https://vtrtshvfwjjazpvcmfcq.supabase.co';
const SB_KEY='sb_publishable_IIiVphchfanRWnzi9jehCQ_qt6w8i8o';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const SESSION_KEY='soforOturumV1';

const G=0,P=1;   // garaj / tesis düğüm indeksleri (rota yayınında kullanılmıyor ama netlik için)
const L2=n=>Math.round(n).toLocaleString('tr');
const hhmm=m=>{m=Math.round(m);const h=Math.floor(m/60)%24,mi=m%60;return `${String(h).padStart(2,'0')}:${String(mi).padStart(2,'0')}`;};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const navUrl=(lat,lng)=>`https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;

let session=null;        // {id,plate}
let myVehicle=null;      // routes.data.vehicles[] içindeki kendi kaydı
let orderStatus={};      // oid -> orders satırı (status/delivered_qty/photos/...)
let rtChannel=null;
const isSent=o=>o&&(o.status==='done'||o.status==='onay');   // şoför girdi (onay bekliyor ya da onaylandı)
let extraDone=[];        // bugün bu araçla teslim edilip rotada görünmeyenler (plan dışı / rotadan çıkmış)
let adhocMode=false, adhocGps=null;
let editRow=null;         // düzenlenen (onay bekleyen) sipariş satırı

/* ---------- giriş / çıkış ---------- */
function loadSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null');}catch(e){return null;}}
function saveSession(s){try{localStorage.setItem(SESSION_KEY,JSON.stringify(s));}catch(e){}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY);}catch(e){}}

async function loadPlateList(){
  const err=document.getElementById('loginErr');
  const box=document.getElementById('plateList');
  err.textContent='';box.innerHTML='<div class="sub">Yükleniyor…</div>';
  try{
    const{data,error}=await sb.from('tankers').select('id,plate').order('sort');
    if(error)throw error;
    if(!data||!data.length){box.innerHTML='';err.textContent='Kayıtlı tanker bulunamadı.';return;}
    box.innerHTML=data.map(t=>`<button class="plateBtn" onclick='selectPlate(${JSON.stringify(t.id)},${JSON.stringify(t.plate)})'>${esc(t.plate)}</button>`).join('');
  }catch(e){
    console.warn(e);
    box.innerHTML='';
    err.textContent='Bağlantı hatası — internet/sinyal kontrol edin.';
  }
}
function selectPlate(id,plate){
  session={id,plate};
  saveSession(session);
  enterApp();
}
function doLogout(){
  if(rtChannel){sb.removeChannel(rtChannel);rtChannel=null;}
  if(refreshTimer){clearInterval(refreshTimer);refreshTimer=null;}
  clearSession();session=null;myVehicle=null;orderStatus={};
  document.getElementById('app').classList.remove('on');
  document.getElementById('login').style.display='flex';
  loadPlateList();
}
let refreshTimer=null;
function enterApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  document.getElementById('hdrPlate').textContent=session.plate;
  document.getElementById('hdrDate').textContent=new Date().toLocaleDateString('tr-TR',{day:'2-digit',month:'long',year:'numeric'});
  loadRoute(true);
  subscribeRealtime();
  // yedek yenileme: mobilde realtime bağlantısı sessizce kopabilir (zayıf
  // sinyal, arka plana atma vb.) — bu, rotayı kendiliğinden tazeler.
  if(!refreshTimer)refreshTimer=setInterval(()=>loadRoute(false),45000);
}

/* ---------- rota yükleme ---------- */
async function loadRoute(manual){
  const tl=document.getElementById('timeline');
  if(manual)tl.innerHTML='<div class="empty">Yükleniyor…</div>';
  try{
    const{data,error}=await sb.from('routes').select('data').eq('id',1).single();
    if(error)throw error;
    const payload=data?.data;
    // rota başka bir günün ise (dünkü yayın) bugün için geçersiz
    const fresh=payload?.ts&&(()=>{const d=new Date(payload.ts),t=new Date();return d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()&&d.getDate()===t.getDate();})();
    myVehicle=fresh?(payload?.vehicles||[]).find(v=>v.plate===session.plate)||null:null;
    if(myVehicle){
      const oids=myVehicle.legs.filter(l=>l.kind==='drop').map(l=>l.oid).filter(Boolean);
      if(oids.length){
        const{data:ords,error:oe}=await sb.from('orders').select('id,status,delivered_qty,delivered_at,photos,deliver_note,vehicle,customer_id').in('id',oids);
        if(oe)throw oe;
        orderStatus={};ords.forEach(o=>orderStatus[o.id]=o);
      }else orderStatus={};
    }
    const t0=new Date();t0.setHours(0,0,0,0);
    const{data:ex,error:ee}=await sb.from('orders').select('id,status,delivered_qty,delivered_at,photos,deliver_note,vehicle,customer_id,customers(name,lat,lng)')
      .eq('vehicle',session.plate).in('status',['done','onay']).gte('delivered_at',t0.toISOString())
      .order('delivered_at',{ascending:false});
    if(ee)throw ee;
    const routeOids=new Set((myVehicle?.legs||[]).filter(l=>l.kind==='drop').map(l=>l.oid));
    extraDone=(ex||[]).filter(o=>!routeOids.has(o.id));
    document.getElementById('lastSync').textContent='son güncelleme: '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
    render();
  }catch(e){
    console.warn(e);
    tl.innerHTML='<div class="empty">Rota yüklenemedi.<br>İnternet/sinyal kontrol edip "Yenile"ye basın.</div>';
  }
}
function subscribeRealtime(){
  if(rtChannel)return;
  rtChannel=sb.channel('sofor-routes')
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'routes'},()=>loadRoute(false))
    .subscribe();
}

/* ---------- görünüm ---------- */
function extraHtml(){
  if(!extraDone.length)return '';
  return `<div class="secBand">✓ Tamamlanan — plan dışı / rotadan çıkan</div>`+extraDone.map(o=>{
    const pend=o.status==='onay';
    return `<div class="sh-step">
      <div class="sh-n ${pend?'pend':'ok'}">${pend?'⏳':'✓'}</div>
      <div>
        <div class="sh-t"><b>${esc(o.customers?.name||'—')}</b><span class="sh-time">${o.delivered_at?new Date(o.delivered_at).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}):''}</span></div>
        <div class="sh-info"><span class="sh-vol ${pend?'pend':'ok'}">${L2(o.delivered_qty||0)} L</span> ${pend?'onay bekliyor':'teslim edildi'}</div>
        <div class="sh-acts"><button class="sh-btn ${pend?'purple':'grey'}" onclick="openDone('${o.id}')">${pend?'✎ Detay / düzenle':'Detay'}</button></div>
      </div></div>`;
  }).join('');
}
function render(){
  const tl=document.getElementById('timeline');
  const drops=myVehicle?myVehicle.legs.filter(l=>l.kind==='drop'):[];
  const doneCount=drops.filter(l=>isSent(orderStatus[l.oid])).length+extraDone.length;
  const volDone=drops.reduce((s,l)=>{const o=orderStatus[l.oid];return s+(isSent(o)?(o.delivered_qty||0):0);},0)
    +extraDone.reduce((s,o)=>s+(o.delivered_qty||0),0);
  document.getElementById('sTot').textContent=drops.length+extraDone.length;
  document.getElementById('sDone').textContent=doneCount;
  document.getElementById('sVol').textContent=L2(volDone);
  if(!myVehicle){
    tl.innerHTML='<div class="empty">Bugün için sana atanmış bir rota yok.<br>Planlamacı rotayı yayınladığında burada görünecek.<br>Rota dışı bir yere teslimat yaptıysan yukarıdaki <b>Plan dışı teslimat</b> ile kaydedebilirsin.</div>'+extraHtml();
    return;
  }

  let n=0;
  tl.innerHTML=myVehicle.legs.map((l,i)=>{
    if(l.kind==='garage')return `<div class="sh-step"><div class="sh-n garage sq">🅿</div><div>
      <div class="sh-t"><b>${esc(l.label)}</b><span class="sh-time">${hhmm(l.time)}</span></div></div></div>`;
    if(l.kind==='plant'){
      const done=fisUploaded[i];
      return `<div class="sh-step"><div class="sh-n plant sq">⛽</div><div>
        <div class="sh-t"><b>Tesiste dolum</b><span class="sh-time">${hhmm(l.time)}</span></div>
        <div class="sh-info"><b>${L2(l.vol)} L full doldur</b></div>
        <div class="sh-acts">${done
          ?`<span class="sh-info" style="margin:0;color:var(--diesel)">✓ Fiş yüklendi</span>`
          :`<button class="sh-btn green" onclick="openFis(${i},${l.vol})">🧾 Fiş yükle</button>`}</div>
      </div></div>`;
    }
    if(l.kind==='xfer')return `<div class="sh-step"><div class="sh-n xfer sq">⇄</div><div>
      <div class="sh-t"><b>Garajda aktarım</b><span class="sh-time">${hhmm(l.time)}</span></div>
      <div class="sh-info">${(l.items||[]).map(t=>t.to===session.plate?`<b>${esc(t.from)}</b>'den ${L2(t.vol)} L alındı`:`<b>${esc(t.to)}</b>'e ${L2(t.vol)} L verildi`).join('<br>')}</div></div></div>`;
    if(l.kind==='feedout')return `<div class="sh-step"><div class="sh-n xfer sq">📤</div><div>
      <div class="sh-t"><b>Besleme (garajda aktarım)</b><span class="sh-time">${hhmm(l.time)}</span></div>
      <div class="sh-info">${L2(l.vol)} L dağıtıldı</div></div></div>`;
    if(l.kind!=='drop')return '';
    n++;
    const o=orderStatus[l.oid];
    const isDone=isSent(o), isPend=o?.status==='onay';
    const cls=isPend?'pend':isDone?'ok':'';
    return `<div class="sh-step">
      <div class="sh-n ${cls}">${isPend?'⏳':isDone?'✓':n}</div>
      <div>
        <div class="sh-t"><b>${esc(l.name)}</b><span class="sh-time">${hhmm(l.time)}</span></div>
        <div class="sh-info">
          <span class="sh-vol ${cls}">${L2(isDone?(o.delivered_qty||0):l.give)} L</span>${l.comp?` Göz ${l.comp}`:''}
          <br>${isPend?'⏳ onay bekliyor · planlanan '+L2(l.give)+' L':isDone?'✓ teslim edildi · planlanan '+L2(l.give)+' L':'planlanan '+L2(l.give)+' L'}
        </div>
        <div class="sh-acts">
          <a class="sh-btn" href="${navUrl(l.lat,l.lng)}" target="_blank" rel="noopener">▸ Yol tarifi</a>
          <button class="sh-btn ${isPend?'purple':isDone?'grey':'green'}" onclick="openStop('${l.oid}')">${isPend?'✎ Detay / düzenle':isDone?'Detay':'✓ Teslim gir'}</button>
        </div>
      </div>
    </div>`;
  }).join('')+extraHtml();
}

/* ---------- teslim modalı ---------- */
let curLeg=null;
let photoTank=null, photoIrs=null;
let fisUploaded={};   // plant leg index -> fiş foto url (bu oturum için)

function checkReady(){

    ok=ok&&!!custOk;
  }

  if(btn)btn.disabled=!ok;

document.addEventListener('input',e=>{if(e.target&&(e.target.id==='fLitre'||e.target.id==='aNewName'))checkReady();});

function getGps(){
  return new Promise(resolve=>{
    if(!navigator.geolocation)return resolve(null);
    const timer=setTimeout(()=>resolve(null),4000);
    navigator.geolocation.getCurrentPosition(
      pos=>{clearTimeout(timer);resolve({lat:pos.coords.latitude,lng:pos.coords.longitude});},
      ()=>{clearTimeout(timer);resolve(null);},
      {enableHighAccuracy:true,timeout:3800}
    );
  });
}
function extOf(file){
  if(file.type==='image/png')return 'png';
  if(file.type==='image/webp')return 'webp';
  return 'jpg';
}
// Supabase depolama alanını korumak için: yüklemeden önce fotoğrafı
// tarayıcıda küçültüp sıkıştırır (uzun kenar max 1600px, JPEG q=0.75).
// Sıkıştırma başarısız olursa orijinal dosya olduğu gibi yüklenir.
async function compressImage(file,maxDim=1600,quality=0.75){
  try{
    const bitmap=await createImageBitmap(file);
    let w=bitmap.width,h=bitmap.height;
    if(w>maxDim||h>maxDim){
      if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}
    }
    const canvas=document.createElement('canvas');
    canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(bitmap,0,0,w,h);
    bitmap.close?.();
    const blob=await new Promise(res=>canvas.toBlob(res,'image/jpeg',quality));
    return (blob&&blob.size<file.size)?blob:file;   // zaten küçük dosyayı büyütme
  }catch(e){
    console.warn('fotoğraf sıkıştırılamadı, orijinal yükleniyor:',e);
    return file;
  }
}
// Veri tasarrufu için: tam boyutlu fotoğrafın yanında çok daha küçük bir
// "thumb" (önizleme) de yüklenir. Listelerdeki küçük resimler bu thumb'ı
// kullanır — tam fotoğraf yalnızca tıklanıp açıldığında indirilir.
async function uploadPhoto(file,oid,tag){
  const full=await compressImage(file,1280,0.65);
  const thumb=await compressImage(file,220,0.55);
  const stamp=Date.now();
  const base=`teslimat/${session.plate.replace(/\s+/g,'')}/${oid}-${stamp}-${tag}`;
  const fullExt=full.type==='image/jpeg'?'jpg':extOf(file);
  const fullPath=`${base}.${fullExt}`;
  const{error}=await sb.storage.from('belgeler').upload(fullPath,full,{upsert:false,contentType:full.type||file.type||'image/jpeg'});
  if(error)throw error;
  const{data}=sb.storage.from('belgeler').getPublicUrl(fullPath);
  let thumbUrl=data.publicUrl;
  try{
    const thumbExt=thumb.type==='image/jpeg'?'jpg':extOf(file);
    const thumbPath=`${base}-thumb.${thumbExt}`;
    const{error:te}=await sb.storage.from('belgeler').upload(thumbPath,thumb,{upsert:false,contentType:thumb.type||file.type||'image/jpeg'});
    if(!te){const{data:td}=sb.storage.from('belgeler').getPublicUrl(thumbPath);thumbUrl=td.publicUrl;}
  }catch(e){console.warn('küçük önizleme yüklenemedi, tam boyut kullanılacak:',e);}
  return {url:data.publicUrl,thumb:thumbUrl};
}

function findLegName(oid){const l=myVehicle&&myVehicle.legs.find(x=>x.kind==='drop'&&x.oid===oid);return l?l.name:'';}
async function submitEdit(isAdhoc){
  if(!editRow)return;
  const litre=parseFloat(document.getElementById('fLitre').value);
  const note=document.getElementById('fNote').value.trim();
  if(!(litre>0))return;
  const btn=document.getElementById('btnSave'),noteEl=document.getElementById('saveNote');
  btn.disabled=true;
  try{
    const old=editRow.photos||[];
    const keep=t=>old.find(p=>p.type===t);
    let tank=keep('tank'),irs=keep('irsaliye');
    if(photoTank||photoIrs)noteEl.textContent='Fotoğraflar yükleniyor…';
    const tag='edit'+Date.now();
    const[nt,ni]=await Promise.all([
      photoTank?uploadPhoto(photoTank,tag,'tank'):null,
      photoIrs?uploadPhoto(photoIrs,tag,'irsaliye'):null
    ]);
    if(nt)tank={type:'tank',url:nt.url,thumb:nt.thumb};
    if(ni)irs={type:'irsaliye',url:ni.url,thumb:ni.thumb};
    noteEl.textContent='Kaydediliyor…';
    const{data,error}=await sb.from('orders').update({
      delivered_qty:Math.round(litre),
      deliver_note:isAdhoc?('[Plan dışı] '+note).trim():(note||null),
      photos:[tank,irs].filter(Boolean)
    }).eq('id',editRow.id).eq('status','onay').select('id');   // arada onaylandıysa değişmez
    if(error)throw error;
    if(!data||!data.length){
      noteEl.textContent='Bu teslimat az önce onaylandı — artık değiştirilemez.';
      loadRoute(false);btn.disabled=false;return;
    }
    closeDlg();loadRoute(false);
    toast('Teslimat güncellendi');
  }catch(e){
    console.warn(e);
    noteEl.textContent='Hata: kaydedilemedi. Sinyal kontrol edip tekrar deneyin.';
    btn.disabled=false;
  }
}

/* ---------- plan dışı teslimat ---------- */
function getGpsLong(){
  return new Promise(resolve=>{
    if(!navigator.geolocation)return resolve({err:'unsupported'});
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude,lng:pos.coords.longitude}),
      e=>resolve({err:e.code===1?'denied':'fail'}),
      {enableHighAccuracy:true,timeout:15000,maximumAge:0}
    );
  });
}

    </div>

    <label>Boşaltılan Litre</label>
    <input type="number" id="fLitre" inputmode="numeric" placeholder="0">

    <label>Dolum Tankı Fotoğrafı</label>
    <button class="photobtn" id="btnTank" onclick="document.getElementById('fileTank').click()"><span class="icon">📷</span><span>Fotoğraf çek</span></button>
    <input type="file" id="fileTank" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this,'tank')">

    <button class="photobtn" id="btnIrs" onclick="document.getElementById('fileIrs').click()"><span class="icon">📄</span><span>Fotoğraf çek</span></button>
    <input type="file" id="fileIrs" accept="image/*" capture="environment" style="display:none" onchange="onPhoto(this,'irsaliye')">

    <label>Not (opsiyonel)</label>

    <div class="dlgbtns">
      <button class="btn-cancel" onclick="closeDlg()">Vazgeç</button>

    </div>

async function fetchAdhocGps(){
  const info=document.getElementById('aGpsInfo');
  info.className='gpsInfo';info.textContent='Konum alınıyor…';
  adhocGps=null;checkReady();
  const r=await getGpsLong();
  if(!adhocMode)return;
  if(r.err){
    info.className='gpsInfo err';
    info.textContent=r.err==='denied'?'Konum izni verilmedi — telefon/tarayıcı ayarlarından bu site için konuma izin ver, sonra "yeniden al"a bas.':'Konum alınamadı — açık alanda tekrar dene.';
  }else{
    adhocGps=r;
    info.className='gpsInfo ok';
    info.textContent=`✓ Konum alındı (${r.lat.toFixed(5)}, ${r.lng.toFixed(5)})`;
  }
  checkReady();
}
function onAdhocCust(){
  const isNew=document.getElementById('aCust').value==='__new__';
  document.getElementById('aNewBox').style.display=isNew?'block':'none';
  if(isNew){adhocGps=null;document.getElementById('aNewName').focus();fetchAdhocGps();}
  else{adhocGps=null;}
  checkReady();
}
async function submitAdhoc(){
  if(!adhocMode)return;
  const sel=document.getElementById('aCust').value;
  const litre=parseFloat(document.getElementById('fLitre').value);
  const note=document.getElementById('fNote').value.trim();
  const isNew=sel==='__new__';
  const newName=isNew?document.getElementById('aNewName').value.trim():'';
  if(!sel||!(litre>0)||!photoTank||!photoIrs||(isNew&&(!newName||!adhocGps)))return;
  const btn=document.getElementById('btnSave');
  const noteEl=document.getElementById('saveNote');
  btn.disabled=true;
  try{
    let cid=sel;
    if(isNew){
      noteEl.textContent='Müşteri kaydediliyor…';
      const{data,error}=await sb.from('customers').insert({name:newName,lat:adhocGps.lat,lng:adhocGps.lng}).select().single();
      if(error)throw error;
      cid=data.id;
    }
    // müşterinin açık (wait/plan) siparişi varsa aynı teslimatı iki kez saymamak için ona işle
    let existing=null;
    if(!isNew){
      const{data:open,error:oe}=await sb.from('orders').select('id,qty,status').eq('customer_id',cid)
        .in('status',['wait','plan','road']).order('created_at').limit(1);
      if(oe)throw oe;
      if(open&&open.length){
        if(confirm(`Bu müşterinin açık bir siparişi var (${L2(open[0].qty)} L).\n\nBu teslimat o siparişe işlensin mi?\n\nTamam = o siparişi teslim edildi yap\nİptal = ayrı, plan dışı yeni kayıt oluştur`))existing=open[0];
      }
    }
    noteEl.textContent='Fotoğraflar yükleniyor…';
    const tag='adhoc'+Date.now();
    const[tankRes,irsRes,gps]=await Promise.all([
      uploadPhoto(photoTank,tag,'tank'),
      uploadPhoto(photoIrs,tag,'irsaliye'),
      isNew?Promise.resolve(adhocGps):getGps()
    ]);
    noteEl.textContent='Kaydediliyor…';
    const done={
      status:'onay',
      vehicle:session.plate,
      delivered_qty:Math.round(litre),
      deliver_note:('[Plan dışı] '+note).trim(),
      photos:[{type:'tank',url:tankRes.url,thumb:tankRes.thumb},{type:'irsaliye',url:irsRes.url,thumb:irsRes.thumb}],
      gps_lat:gps?gps.lat:null,
      gps_lng:gps?gps.lng:null,
      delivered_at:new Date().toISOString()
    };
    let error;
    if(existing){
      ({error}=await sb.from('orders').update(done).eq('id',existing.id));
    }else{
      ({error}=await sb.from('orders').insert({...done,customer_id:cid,qty:Math.round(litre),note:'Plan dışı teslimat'}));
    }
    if(error)throw error;
    closeDlg();
    loadRoute(false);
    toast('Teslimat gönderildi — planlayıcı onayından sonra kaydedilecek');
  }catch(e){
    console.warn(e);
    noteEl.textContent='Hata: kaydedilemedi. Sinyal kontrol edip tekrar deneyin (girdikleriniz kaybolmadı).';
    btn.disabled=false;
  }
}

async function submitDelivery(){
  if(!curLeg)return;
  const litre=parseFloat(document.getElementById('fLitre').value);
  const note=document.getElementById('fNote').value.trim();
  if(!(litre>0)||!photoTank||!photoIrs)return;
  const btn=document.getElementById('btnSave');
  const noteEl=document.getElementById('saveNote');
  btn.disabled=true;
  try{
    noteEl.textContent='Fotoğraflar yükleniyor…';
    const[tankRes,irsRes,gps]=await Promise.all([
      uploadPhoto(photoTank,curLeg.oid,'tank'),
      uploadPhoto(photoIrs,curLeg.oid,'irsaliye'),
      getGps()
    ]);
    noteEl.textContent='Kaydediliyor…';
    const{error}=await sb.from('orders').update({
      status:'onay',
      delivered_qty:Math.round(litre),
      deliver_note:note||null,
      photos:[{type:'tank',url:tankRes.url,thumb:tankRes.thumb},{type:'irsaliye',url:irsRes.url,thumb:irsRes.thumb}],
      gps_lat:gps?gps.lat:null,
      gps_lng:gps?gps.lng:null,
      delivered_at:new Date().toISOString()
    }).eq('id',curLeg.oid);
    if(error)throw error;
    closeDlg();
    loadRoute(false);
    toast('Teslimat gönderildi — planlayıcı onayından sonra kaydedilecek');
  }catch(e){
    console.warn(e);
    noteEl.textContent='Hata: kaydedilemedi. Sinyal kontrol edip tekrar deneyin (girdikleriniz kaybolmadı).';
    btn.disabled=false;
  }
}
function toast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1b1917;color:#f3efe7;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:5000;box-shadow:0 6px 18px rgba(27,25,23,.35);max-width:88vw;text-align:center';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),4000);
}

/* ---------- başlangıç ---------- */
(function init(){
  session=loadSession();
  if(session)enterApp();else loadPlateList();
})();
</script>
